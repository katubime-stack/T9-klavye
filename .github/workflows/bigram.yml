name: Bigram uret
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install datasets
      - run: python bigram.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets/bigram.tsv
          git commit -m "bigram.tsv guncellendi" || echo "degisiklik yok"
          git push
