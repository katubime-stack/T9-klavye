name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sozluk hazirla
        run: python3 sozluk.py

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        run: gradle assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: T9-Klavyem-APK
          path: app/build/outputs/apk/debug/*.apk
